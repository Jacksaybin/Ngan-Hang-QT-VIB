[build]
  command = "npm run bild"
  publish = "public"
  functions = "netlify/functions"
  base = "."

# Production environment placeholders (set secrets in Netlify UI)
[context.production.environment]
# TELEGRAM_BOT_TOKEN = "set_in_netlify"
# TELEGRAM_CHAT_ID = "set_in_netlify"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/field-update"
  status = 200
  force = true
