<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yêu cầu đã gửi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
        }

        .checkmark {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FFA300, #ffbe40);
            color: #1f2d3d;
            font-size: 48px;
            font-weight: 600;
            box-shadow: 0 10px 24px -4px rgba(0, 0, 0, .12), 0 4px 12px -2px rgba(0, 0, 0, .08);
        }

        .card-gradient {
            background: linear-gradient(180deg, #ffffff 0%, #ffffffcc 60%, #ffffff 100%);
            backdrop-filter: blur(6px);
        }

        .muted {
            color: #6c757d;
            font-size: .875rem;
        }

        .data-row {
            display: flex;
            gap: 6px;
            align-items: flex-start;
            padding: 4px 0;
            border-bottom: 1px dashed #e3e8ef;
            font-size: .95rem;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .label {
            min-width: 120px;
            color: #495057;
            font-weight: 500;
        }

        .value {
            flex: 1;
        }

        .actions a {
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="text-center mb-4">
                    <div class="checkmark mx-auto mb-3">✓</div>
                    <h1 class="h4 mb-2">Yêu cầu đã được gửi</h1>
                    <p class="text-muted mb-0">Chúng tôi đã nhận được thông tin tạm khóa / hủy thẻ của bạn.</p>
                </div>
                <div class="card shadow-sm card-gradient mb-4">
                    <div class="card-body">
                        <h2 class="h6 text-uppercase text-muted mb-3" style="letter-spacing:.5px">Tóm tắt nhanh</h2>
                        <div id="summaryDetails" class="mb-2 small"></div>
                        <div class="data-row">
                            <div class="label">Mã yêu cầu</div>
                            <div class="value fw-semibold" id="reqId">—</div>
                        </div>
                        <div class="data-row">
                            <div class="label">Gửi lúc</div>
                            <div class="value" id="submittedAt">—</div>
                        </div>
                        <div class="data-row">
                            <div class="label">Lý do</div>
                            <div class="value" id="reasonTxt">—</div>
                        </div>
                        <div class="data-row">
                            <div class="label">SĐT</div>
                            <div class="value" id="phoneTxt">—</div>
                        </div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 actions justify-content-center">
                    <a href="huy-tam-khoa-the.html" class="btn btn-outline-secondary">Tạo yêu cầu mới</a>
                    <a href="index.html#huy-the" class="btn btn-vib" style="background:#FFA300;font-weight:600;">Quay về
                        trang chính</a>
                </div>
                <p class="muted mt-4 text-center">Nếu cần hỗ trợ khẩn cấp, vui lòng liên hệ Hotline chăm sóc khách hàng.
                </p>
            </div>
        </div>
    </main>
    <script>
        (function init() {
            const id = sessionStorage.getItem('submittedRequestId');
            const at = sessionStorage.getItem('submittedAt');
            const phone = sessionStorage.getItem('submittedPhone');
            const reason = sessionStorage.getItem('submittedReason');
            if (!id) {
                document.getElementById('summaryDetails').innerHTML = '<span class="text-danger">Không tìm thấy dữ liệu yêu cầu. Có thể bạn truy cập trực tiếp trang này.</span>';
                return;
            }
            function fmtTime(iso) { try { const d = new Date(iso); return d.toLocaleString('vi-VN', { hour12: false }); } catch { return iso || '—'; } }
            document.getElementById('reqId').textContent = id;
            document.getElementById('submittedAt').textContent = fmtTime(at);
            document.getElementById('phoneTxt').textContent = phone || '—';
            document.getElementById('reasonTxt').textContent = reason || '—';
            document.getElementById('summaryDetails').innerHTML = 'Mã yêu cầu của bạn đã được lưu. Vui lòng giữ lại để tra cứu khi cần.';
            // Optional: clear after rendering to prevent back-nav reuse
            sessionStorage.removeItem('submittedRequestId');
        })();
    </script>
</body>

</html>
